<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Broechem Hop Lobsters — Weekschema</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A0A0A">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hop Lobsters">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --court: #14433D;
    --court-dark: #0C2C28;
    --hero-black: #0A0A0A;
    --ball: #D6F52C;
    --clay: #EFE6D6;
    --ink: #12201C;
    --white: #FDFCF9;
    --line: rgba(253,252,249,0.25);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Work Sans', sans-serif;
    background: var(--clay);
    color: var(--ink);
    line-height: 1.5;
  }

  h1, h2, h3 {
    font-family: 'Archivo Black', sans-serif;
    text-transform: uppercase;
    letter-spacing: -0.01em;
  }

  /* HERO */
  .hero {
    background: var(--hero-black);
    color: var(--white);
    padding: 0.75rem 1.5rem;
    height: 50vh;
    min-height: 280px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .hero-inner {
    position: relative;
    max-width: 780px;
    margin: 0 auto;
    text-align: center;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .hero-logo {
    height: 100%;
    max-height: 100%;
    width: auto;
    max-width: 90vw;
    object-fit: contain;
    filter: drop-shadow(0 20px 30px rgba(0,0,0,0.5));
  }

  /* SCHEDULE */
  .schedule {
    max-width: 1000px;
    margin: 2.5rem auto 0;
    padding: 0 1.5rem 4rem;
    position: relative;
  }

  .schedule-card {
    background: var(--white);
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(20,67,61,0.18);
    padding: 2.5rem;
  }

  .schedule-card h2 {
    font-size: 1.4rem;
    margin-bottom: 0.3rem;
  }

  .schedule-card .sub {
    color: #6b6459;
    margin-bottom: 2rem;
    font-size: 0.95rem;
  }

  .matches {
    display: grid;
    gap: 1.4rem;
  }

  .match {
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
    border: 1px solid #E4DBC8;
    border-radius: 14px;
    padding: 1.2rem;
  }

  .match-top {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    flex-wrap: wrap;
  }

  .cancel-match {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: #E4534B;
    color: var(--white);
    font-size: 0.9rem;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease;
    flex-shrink: 0;
    margin-left: auto;
  }

  .cancel-match:hover {
    background: #C43E37;
  }

  .match .day {
    font-family: 'Archivo Black', sans-serif;
    text-transform: uppercase;
    font-size: 0.95rem;
    color: var(--court);
    text-align: left;
    line-height: 1.1;
    flex-shrink: 0;
  }

  .match .day span {
    display: block;
    font-size: 0.7rem;
    color: var(--court);
    margin-top: 0.2rem;
  }

  .time-input, .court-input {
    background: var(--white);
    border: 1.5px solid #000;
    border-radius: 8px;
    padding: 0.4rem 0.7rem;
    font-size: 0.8rem;
    font-weight: 700;
    font-family: 'Work Sans', sans-serif;
    color: var(--ink);
    cursor: pointer;
    white-space: nowrap;
    text-align: center;
  }

  .time-input.placeholder, .court-input.placeholder {
    color: #E4534B;
  }

  .court {
    position: relative;
    background: var(--court);
    border-radius: 10px;
    padding: 0.9rem 1.2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: var(--white);
    overflow: hidden;
  }

  .court::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 8%;
    bottom: 8%;
    width: 2px;
    background: var(--line);
  }

  .team {
    display: flex;
    gap: 0.6rem;
    z-index: 1;
  }

  .player-wrap {
    position: relative;
    display: inline-block;
  }

  .player {
    background: rgba(253,252,249,0.1);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.35rem 0.85rem;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: grab;
    display: inline-flex;
    align-items: center;
    user-select: none;
    color: var(--white);
  }

  .player.player-me {
    color: #C15C67;
  }

  .player.drag-over {
    outline: 2px dashed var(--ball);
    outline-offset: 2px;
  }

  .player.dragging {
    opacity: 0.4;
  }

  .booker-badge {
    position: absolute;
    bottom: -10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--white);
    border: 1.5px solid #000;
    line-height: 1;
    cursor: grab;
    z-index: 20;
    overflow: hidden;
  }

  .booker-badge.badge-left {
    left: -6px;
  }

  .booker-badge.badge-right {
    right: -6px;
  }

  .booker-badge img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
  }

  .booker-badge.drag-over {
    outline: 2px dashed var(--ball);
    outline-offset: 2px;
  }

  .vs {
    color: var(--ball);
    font-family: 'Archivo Black', sans-serif;
    font-size: 0.75rem;
    z-index: 1;
    padding: 0 0.5rem;
  }

  /* POPUPS (uur-keypad en terrein-dropdown) */
  .popup-panel {
    position: fixed;
    z-index: 500;
    background: var(--white);
    border: 1.5px solid #000;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    padding: 0.8rem;
    display: none;
  }

  .popup-panel.open {
    display: block;
  }

  .time-popup-display {
    font-family: 'Archivo Black', sans-serif;
    font-size: 1.3rem;
    text-align: center;
    color: var(--court);
    margin-bottom: 0.6rem;
    letter-spacing: 0.05em;
  }

  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.4rem;
    width: 180px;
  }

  .keypad button {
    background: var(--clay);
    border: 1px solid #000;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 700;
    padding: 0.6rem 0;
    cursor: pointer;
    color: var(--ink);
  }

  .keypad button:hover {
    background: #E4DBC8;
  }

  .keypad button.keypad-enter {
    background: var(--court);
    color: var(--white);
    grid-column: span 1;
  }

  .keypad button.keypad-back {
    background: #E4534B;
    color: var(--white);
  }

  .court-option {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-bottom: 1px solid #E4DBC8;
    padding: 0.55rem 0.4rem;
    font-size: 0.88rem;
    font-family: 'Work Sans', sans-serif;
    color: var(--ink);
    cursor: pointer;
    min-width: 180px;
  }

  .court-option:last-child {
    border-bottom: none;
  }

  .court-option:hover {
    background: var(--clay);
  }

  .court-other-input {
    width: 100%;
    box-sizing: border-box;
    margin-top: 0.4rem;
    padding: 0.5rem 0.6rem;
    border: 1.5px solid #000;
    border-radius: 8px;
    font-size: 0.88rem;
    font-family: 'Work Sans', sans-serif;
  }

  /* INFO */
  .info {
    max-width: 1000px;
    margin: 0 auto;
    padding: 0 1.5rem 5rem;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.5rem;
  }

  .info-card {
    background: var(--white);
    border-radius: 16px;
    padding: 1.6rem;
    border: 1px solid #E4DBC8;
  }

  .info-card .num {
    font-family: 'Archivo Black', sans-serif;
    color: var(--ball);
    -webkit-text-stroke: 1.5px var(--court);
    font-size: 1.8rem;
    margin-bottom: 0.5rem;
  }

  .info-card h3 {
    font-size: 0.95rem;
    margin-bottom: 0.4rem;
  }

  .info-card p {
    font-size: 0.88rem;
    color: #6b6459;
  }

  /* AVAILABILITY */
  .availability {
    width: 100%;
    margin: 0;
    padding: 0;
  }

  .availability-card {
    background: var(--white);
    width: 100%;
    padding: 1.3rem 0;
    box-shadow: inset 0 1px 0 #E4DBC8, inset 0 -1px 0 #E4DBC8;
  }

  .availability-inner {
    max-width: 1450px;
    margin: 0 auto;
    padding: 0 1.5rem;
  }

  .availability-group {
    display: grid;
    grid-template-columns: 480px 620px;
    column-gap: 12rem;
    row-gap: 1.6rem;
    align-items: stretch;
    width: fit-content;
    margin: 0 auto;
  }

  .player-picker {
    grid-column: 1 / -1;
    grid-row: 1;
  }

  .availability-left {
    grid-column: 1;
    grid-row: 2;
    display: flex;
    flex-direction: column;
  }

  .cal-column {
    max-width: 480px;
    width: 480px;
  }

  .week-table-column {
    grid-column: 2;
    grid-row: 1 / 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100%;
  }

  .week-table-inner {
    width: 100%;
    max-width: 620px;
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  .week-table-wrap {
    flex: 1;
  }

  .week-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.8rem;
  }

  .week-label {
    font-family: 'Archivo Black', sans-serif;
    text-transform: uppercase;
    font-size: 1.15rem;
    color: var(--court);
  }

  .week-table {
    width: 100%;
    height: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }

  .week-table th, .week-table td {
    text-align: center;
    padding: 0;
    border: 1px solid #000;
  }

  .week-table tr > :nth-child(7) {
    border-left: 3px solid #000;
  }

  .week-table thead th {
    font-size: 0.78rem;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--court);
    background: var(--clay);
    line-height: 1.2;
    padding: 0.5rem 0.2rem;
  }

  .week-table thead th span {
    display: block;
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--court);
  }

  .week-table .name-col {
    width: 24%;
    text-align: left;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--ink);
    background: var(--clay);
    padding: 0.4rem 0.6rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  thead .name-col {
    background: var(--clay);
  }

  .week-cell {
    height: 2.6rem;
    background: var(--white);
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .week-cell:hover {
    background: #EFE9DC;
  }

  .week-cell.available {
    background: #C7F0C2;
  }

  .week-cell.proposed {
    background: #FBD2A1;
  }

  .week-cell.confirmed {
    background: #DA8B93;
  }

  .week-cell.available:hover,
  .week-cell.proposed:hover,
  .week-cell.confirmed:hover {
    filter: brightness(0.95);
  }

  .week-actions-bar {
    max-width: 1450px;
    margin: 0 auto;
    padding: 0 1.5rem 3rem;
  }

  .week-actions-inner {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 1rem;
  }

  .week-note {
    font-size: 0.85rem;
    color: #6b6459;
    margin: 0;
  }

  .btn-inplannen {
    background: var(--court);
    color: var(--white);
    border: none;
    font-family: 'Archivo Black', sans-serif;
    text-transform: uppercase;
    font-size: 0.85rem;
    letter-spacing: 0.02em;
    padding: 0.8rem 1.8rem;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .btn-inplannen:hover {
    background: var(--court-dark);
  }

  .week-table thead th.name-col {
    padding: 0.4rem;
    background: var(--white);
    border-top: none;
    border-left: none;
    text-align: center;
    vertical-align: middle;
  }

  .btn-inplannen-cell {
    background: var(--court);
    color: var(--white);
    border: none;
    font-family: 'Archivo Black', sans-serif;
    text-transform: uppercase;
    font-size: 0.72rem;
    letter-spacing: 0.01em;
    padding: 0 1.1rem;
    height: 100%;
    box-sizing: border-box;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .btn-inplannen-cell:hover {
    background: var(--court-dark);
  }

  @media (max-width: 640px) {
    .btn-inplannen-cell {
      height: auto;
      padding: 0.4rem 0.8rem;
      font-size: 0.55rem;
    }
  }

  .availability-card h2 {
    font-size: 1.35rem;
    margin-bottom: 0.15rem;
  }

  .availability-card .sub {
    color: #6b6459;
    margin-bottom: 0.8rem;
    font-size: 0.92rem;
  }

  .player-picker {
    display: flex;
    flex-wrap: nowrap;
    gap: 0.35rem;
    overflow-x: auto;
  }

  .player-pill {
    border: 1.5px solid #000;
    background: var(--clay);
    color: var(--ink);
    font-weight: 600;
    font-size: 0.78rem;
    padding: 0.34rem 0.7rem;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .player-pill:hover {
    border-color: var(--court);
  }

  .player-pill.active {
    background: #C7F0C2;
    border-color: #000;
    color: var(--ink);
  }

  .cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.6rem;
  }

  .cal-nav {
    background: var(--court);
    color: var(--white);
    border: none;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    font-size: 1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s ease;
  }

  .cal-nav:hover {
    background: var(--court-dark);
  }

  .cal-month-label {
    font-family: 'Archivo Black', sans-serif;
    text-transform: uppercase;
    font-size: 0.95rem;
    color: var(--court);
  }

  .cal-body {
    position: relative;
  }

  .cal-body::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: calc(71.4286% + 0.0964rem - 1.25px);
    width: 2.5px;
    background: #000;
    pointer-events: none;
  }

  .cal-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 0.45rem;
    margin-bottom: 0.3rem;
  }

  .cal-weekdays span {
    text-align: center;
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--court);
  }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 0.45rem;
  }

  .cal-day {
    aspect-ratio: 5 / 3;
    border: 1.5px solid #000;
    background: var(--clay);
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .cal-day:hover {
    border-color: var(--court);
  }

  .cal-day.empty {
    background: transparent;
    border: none;
    cursor: default;
  }

  .cal-day.other-month {
    background: var(--white);
    border-color: #000;
    color: #b0a894;
  }

  .cal-day.other-month:hover {
    border-color: var(--court);
  }

  .cal-day.in-week {
    border-width: 3px;
  }

  .cal-day.available {
    background: #C7F0C2;
    border-color: #000;
    color: var(--ink);
  }

  .cal-day.has-match {
    background: #DA8B93;
    border-color: #000;
    color: var(--ink);
  }

  .cal-day.playing-me {
    background: #C15C67;
  }

  .cal-day.today {
    color: #F5E200;
    font-weight: 800;
  }

  .cal-note {
    margin-top: 0.6rem;
    font-size: 0.78rem;
    color: #8a8375;
  }

  footer {
    text-align: center;
    padding: 2.5rem 1.5rem;
    font-size: 0.85rem;
    color: #8a8375;
  }

  @media (max-width: 640px) {
    .schedule-card { padding: 1.4rem; }
    .match { padding: 0.8rem; }
    .match-top { gap: 0.4rem; }
    .time-input, .court-input { font-size: 0.68rem; padding: 0.3rem 0.4rem; }
    .court { padding: 0.55rem 0.6rem 1.1rem; overflow: visible; }
    .team { gap: 0.3rem; }
    .player { font-size: 0.66rem; padding: 0.26rem 0.5rem; }
    .vs { font-size: 0.62rem; padding: 0 0.25rem; }
    .booker-badge {
      width: 30px;
      height: 30px;
      bottom: -25px;
    }
    .booker-badge.badge-left {
      left: -4px;
      right: auto;
    }
    .booker-badge.badge-right {
      right: -4px;
      left: auto;
    }
    .info { grid-template-columns: 1fr; }
    .availability-inner { padding: 0 1rem; }
    .cal-day { font-size: 0.7rem; }
    .availability-group { grid-template-columns: 1fr; width: 100%; margin: 0; }
    .player-picker { grid-column: 1; grid-row: 1; }
    .availability-left { grid-column: 1; grid-row: 2; }
    .week-table-column { grid-column: 1; grid-row: 3; }
    .cal-column, .week-table-column { max-width: 100%; width: 100%; height: auto; }
    .week-table-inner { max-width: 100%; height: auto; }
    .week-table-column { margin-top: 1.5rem; }
    .week-table { height: auto; }
    .week-cell { height: 2.6rem; }
    .player-picker {
      flex-wrap: wrap;
      overflow-x: visible;
      row-gap: 0.4rem;
    }
    .player-pill {
      flex: 0 0 calc(25% - 0.27rem);
      text-align: center;
      padding-left: 0.3rem;
      padding-right: 0.3rem;
    }
  }
  .login-picker {
    display: flex;
    flex-wrap: nowrap;
    justify-content: space-between;
    gap: 0.7rem;
    padding: 0.5rem 0;
  }

  .login-pill {
    border: 1.5px solid #000;
    background: var(--clay);
    color: var(--ink);
    font-weight: 700;
    font-size: 1.05rem;
    padding: 0.85rem 1rem;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
    flex: 1;
    text-align: center;
  }

  .login-pill:hover {
    border-color: var(--court);
    background: #E4DBC8;
  }

  @media (max-width: 640px) {
    .login-picker { flex-wrap: wrap; }
    .login-pill { flex: 1 1 40%; font-size: 0.9rem; padding: 0.7rem 0.8rem; }
  }
</style>
</head>
<body>

<div id="loginView">

<section class="hero">
  <div class="hero-inner">
    <img class="hero-logo" src="hoplobsters-logo.png" alt="Broechem Hop Lobsters logo">
  </div>
</section>

<section class="schedule">
  <div class="schedule-card">
    <h2>Aanmelden</h2>
    <p class="sub"></p>
    <div class="login-picker" id="loginPicker"></div>
  </div>
</section>

</div>

<div id="appView" style="display:none;">

<section class="hero">
  <div class="hero-inner">
    <img class="hero-logo" src="hoplobsters-logo.png" alt="Broechem Hop Lobsters logo">
  </div>
</section>

<section class="schedule">
  <div class="schedule-card">
    <h2>Speelschema</h2>
    <p class="sub"></p>
    <div class="matches" id="matchesContainer"></div>
  </div>
</section>

<section class="availability">
  <div class="availability-card">
    <div class="availability-inner">
      <div class="availability-group">
        <div class="player-picker" id="playerPicker"></div>

        <div class="availability-left">
          <h2>Beschikbaarheid</h2>
          <p class="sub"></p>

          <div class="cal-column">
            <div class="cal-header">
              <button class="cal-nav" id="prevMonth" aria-label="Vorige maand">‹</button>
              <span class="cal-month-label" id="calMonthLabel"></span>
              <button class="cal-nav" id="nextMonth" aria-label="Volgende maand">›</button>

            <div class="cal-body">
              <div class="cal-weekdays">
                <span>Ma</span><span>Di</span><span>Wo</span><span>Do</span><span>Vr</span><span>Za</span><span>Zo</span>
              </div>

              <div class="cal-grid" id="calGrid"></div>
            </div>

            <p class="cal-note" id="calNote"></p>
          </div>
        </div>

        <div class="week-table-column">
          <div class="week-table-inner">
            <div class="week-header">
              <button class="cal-nav" id="prevWeek" aria-label="Vorige week">‹</button>
              <span class="week-label" id="weekLabel"></span>
              <button class="cal-nav" id="nextWeek" aria-label="Volgende week">›</button>
            </div>
            <div class="week-table-wrap">
              <table class="week-table" id="weekTable"></table>

  <div class="week-actions-inner">

</footer>

  <div class="time-popup-display" id="timePopupDisplay">--:--</div>
  <div class="keypad">
    <button data-key="1">1</button>

    <button data-key="4">4</button>
    <button data-key="5">5</button>
    <button data-key="6">6</button>

    <button data-key="8">8</button>

  <div id="courtOptionsList"></div>
  <input type="text" class="court-other-input" id="courtOtherInput" style="display:none;" placeholder="Naam terrein" maxlength="40">
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, onSnapshot, arrayUnion, arrayRemove, deleteField } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB-KnfhkZpEaJFCZuGqvGZ289QfH69Et1U",
    authDomain: "broechem-hop-lobsters.firebaseapp.com",
    projectId: "broechem-hop-lobsters",
    storageBucket: "broechem-hop-lobsters.firebasestorage.app",
    messagingSenderId: "829408587300",
    appId: "1:829408587300:web:6d4a80b2e7a05a92fd32b1"
  };

  const firebaseApp = initializeApp(firebaseConfig);
  const auth = getAuth(firebaseApp);
  const db = getFirestore(firebaseApp);
  const availabilityDocRef = doc(db, "padel", "beschikbaarheid");
  const voorstelDocRef = doc(db, "padel", "voorstel");
  const schemaDocRef = doc(db, "padel", "schema");
  const geschiedenisDocRef = doc(db, "padel", "geschiedenis");

  const PLAYERS = ["Kristof", "Kenny", "Kevin", "Ken", "Sven", "Jurgen", "Bert", "Guido"];
  const MONTH_NAMES = ["Januari","Februari","Maart","April","Mei","Juni","Juli","Augustus","September","Oktober","November","December"];

  let data = {};
  let voorstelData = {};
  let schemaData = {};
  let geschiedenisData = {};

  let currentPlayer = null;

  const playerPicker = document.getElementById("playerPicker");
  const loginPicker = document.getElementById("loginPicker");
  const loginView = document.getElementById("loginView");
  const appView = document.getElementById("appView");
  const calGrid = document.getElementById("calGrid");
  const calMonthLabel = document.getElementById("calMonthLabel");
  const calNote = document.getElementById("calNote");
  const weekTable = document.getElementById("weekTable");
  const weekLabel = document.getElementById("weekLabel");
  const weekNote = document.getElementById("weekNote");
  const inplannenBtn = document.getElementById("inplannenBtn");
  const matchesContainer = document.getElementById("matchesContainer");
  const prevMonthBtn = document.getElementById("prevMonth");
  const prevWeekBtn = document.getElementById("prevWeek");

  const DAY_LABELS = ["Maandag","Dinsdag","Woensdag","Donderdag","Vrijdag","Zaterdag","Zondag"];
  const DAY_SHORT = ["Ma","Di","Wo","Do","Vr","Za","Zo"];

  function getMonday(d) {
    const date = new Date(d);
    const day = date.getDay();
    const diff = day === 0 ? -6 : 1 - day;
    date.setDate(date.getDate() + diff);
    date.setHours(0,0,0,0);
    return date;
  }

  function startOfToday() {
    const d = new Date();
    d.setHours(0,0,0,0);
    return d;
  }

  const currentMonthDate = (() => { const d = startOfToday(); d.setDate(1); return d; })();
  const currentWeekMonday = getMonday(startOfToday());

  function isBeforeCurrentMonth(d) {
    return d.getFullYear() < currentMonthDate.getFullYear() ||
      (d.getFullYear() === currentMonthDate.getFullYear() && d.getMonth() < currentMonthDate.getMonth());
  }

  function isBeforeCurrentWeek(d) {
    return d.getTime() < currentWeekMonday.getTime();
  }

  // Laatst bekeken maand/week onthouden per toestel
  let viewDate;
  try {
    const savedMonth = localStorage.getItem("hoplobsters-laatste-maand");
    viewDate = savedMonth ? new Date(savedMonth) : new Date();
  } catch (e) {
    viewDate = new Date();
  }
  viewDate.setDate(1);
  if (isBeforeCurrentMonth(viewDate)) viewDate = new Date(currentMonthDate);

  let weekViewDate;
  try {
    const savedWeek = localStorage.getItem("hoplobsters-laatste-week");
    weekViewDate = savedWeek ? getMonday(new Date(savedWeek)) : getMonday(new Date());
  } catch (e) {
    weekViewDate = getMonday(new Date());
  }
  if (isBeforeCurrentWeek(weekViewDate)) weekViewDate = new Date(currentWeekMonday);

  function saveViewState() {
    try {
      localStorage.setItem("hoplobsters-laatste-maand", viewDate.toISOString());
      localStorage.setItem("hoplobsters-laatste-week", weekViewDate.toISOString());
    } catch (e) {}
  }

  function renderLoginPicker() {
    loginPicker.innerHTML = "";
    PLAYERS.forEach(name => {
      const pill = document.createElement("button");
      pill.className = "login-pill";
      pill.textContent = name;
      pill.addEventListener("click", () => {
        currentPlayer = name;
        loginView.style.display = "none";
        appView.style.display = "";
        renderPlayerPicker();
        renderCalendar();
        renderWeekTable();
        renderMatches();
        calNote.textContent = "Klik op een dag om je beschikbaarheid aan/uit te zetten.";
      });
      loginPicker.appendChild(pill);
    });
  }

  async function saveDay(playerName, key, newValue) {
    try {
      await setDoc(availabilityDocRef, { [playerName]: { [key]: newValue } }, { merge: true });
    } catch (e) {
      calNote.textContent = "Kon niet opslaan — controleer je internetverbinding.";
    }
  }

  // Aanmelden (onzichtbaar, geen inlogscherm) en dan pas de app opstarten
  onAuthStateChanged(auth, (user) => {
    if (user) {
      startApp();
    }
  });
  signInAnonymously(auth).catch(() => {
    calNote.textContent = "Kon niet verbinden met de gedeelde beschikbaarheid.";
  });

  let appStarted = false;
  function startApp() {
    if (appStarted) return;
    appStarted = true;

    renderLoginPicker();

    const loadedFlags = { availability: false, voorstel: false, schema: false, geschiedenis: false };
    let cleanupDone = false;

    function maybeRunCleanup() {
      if (cleanupDone || !(loadedFlags.availability && loadedFlags.voorstel && loadedFlags.schema && loadedFlags.geschiedenis)) return;
      cleanupDone = true;
      cleanupPastData();
    }

    // Live meeluisteren: zodra iemand anders iets aanklikt, werkt dit automatisch bij
    onSnapshot(availabilityDocRef, (snap) => {
      data = snap.exists() ? snap.data() : {};
      loadedFlags.availability = true;
      renderCalendar();
      renderWeekTable();
      maybeRunCleanup();
    });

    onSnapshot(voorstelDocRef, (snap) => {
      voorstelData = snap.exists() ? snap.data() : {};
      loadedFlags.voorstel = true;
      renderWeekTable();
      maybeRunCleanup();
    });

    onSnapshot(schemaDocRef, (snap) => {
      schemaData = snap.exists() ? snap.data() : {};
      loadedFlags.schema = true;
      renderMatches();
      renderWeekTable();
      renderCalendar();
      maybeRunCleanup();
    });

    onSnapshot(geschiedenisDocRef, (snap) => {
      geschiedenisData = snap.exists() ? snap.data() : {};
      loadedFlags.geschiedenis = true;
      maybeRunCleanup();
    });

    renderPlayerPicker();
    renderCalendar();
    renderWeekTable();
    renderMatches();
  }

  function dateKeyMonthsAgo(months) {
    const d = startOfToday();
    d.setMonth(d.getMonth() - months);
    return dateKey(d);
  }

  async function cleanupPastData() {
    const todayKey = dateKey(startOfToday());
    const historyLimitKey = dateKeyMonthsAgo(3);

    const availUpdates = {};
    let hasAvailUpdates = false;
    Object.keys(data).forEach(player => {
      const dates = data[player] || {};
      Object.keys(dates).forEach(key => {
        if (key < todayKey) {
          if (!availUpdates[player]) availUpdates[player] = {};
          availUpdates[player][key] = deleteField();
          hasAvailUpdates = true;
          delete data[player][key];
        }
      });
    });

    const voorstelUpdates = {};
    let hasVoorstelUpdates = false;
    Object.keys(voorstelData).forEach(key => {
      if (key < todayKey) {
        voorstelUpdates[key] = deleteField();
        hasVoorstelUpdates = true;
        delete voorstelData[key];
      }
    });

    // Verlopen wedstrijden: verplaatsen naar geschiedenis (voor statistiek) i.p.v. meteen wissen
    const schemaUpdates = {};
    let hasSchemaUpdates = false;
    const geschiedenisAdditions = {};
    let hasGeschiedenisAdditions = false;
    Object.keys(schemaData).forEach(key => {
      if (key < todayKey) {
        if (schemaData[key] && schemaData[key].length > 0) {
          geschiedenisAdditions[key] = schemaData[key];
          hasGeschiedenisAdditions = true;
        }
        schemaUpdates[key] = deleteField();
        hasSchemaUpdates = true;
        delete schemaData[key];
      }
    });
    Object.keys(geschiedenisAdditions).forEach(key => {
      geschiedenisData[key] = geschiedenisAdditions[key];
    });

    // Geschiedenis ouder dan 3 maanden: definitief wissen
    const geschiedenisRemovals = {};
    let hasGeschiedenisRemovals = false;
    Object.keys(geschiedenisData).forEach(key => {
      if (key < historyLimitKey) {
        geschiedenisRemovals[key] = deleteField();
        hasGeschiedenisRemovals = true;
        delete geschiedenisData[key];
      }
    });

    try {
      if (hasAvailUpdates) await setDoc(availabilityDocRef, availUpdates, { merge: true });
      if (hasVoorstelUpdates) await setDoc(voorstelDocRef, voorstelUpdates, { merge: true });
      if (hasSchemaUpdates) await setDoc(schemaDocRef, schemaUpdates, { merge: true });
      if (hasGeschiedenisAdditions) await setDoc(geschiedenisDocRef, geschiedenisAdditions, { merge: true });
      if (hasGeschiedenisRemovals) await setDoc(geschiedenisDocRef, geschiedenisRemovals, { merge: true });
    } catch (e) {}

    renderCalendar();
    renderWeekTable();
    renderMatches();
  }

  function renderPlayerPicker() {
    playerPicker.innerHTML = "";
    PLAYERS.forEach(name => {
      const pill = document.createElement("button");
      pill.className = "player-pill" + (name === currentPlayer ? " active" : "");
      pill.textContent = name;
      pill.addEventListener("click", () => {
        currentPlayer = name;
        renderPlayerPicker();
        renderCalendar();
        renderMatches();
        calNote.textContent = "Klik op een dag om je beschikbaarheid aan/uit te zetten.";
      });
      playerPicker.appendChild(pill);
    });
  }

  function dateKey(d) {
    return d.getFullYear() + "-" + (d.getMonth()+1).toString().padStart(2,"0") + "-" + d.getDate().toString().padStart(2,"0");
  }

  function getConfirmedPlayers(key) {
    const matches = schemaData[key] || [];
    return matches.flatMap(m => m.players || []);
  }

  function makeDayButton(dateObj, inCurrentMonth) {
    const key = dateKey(dateObj);
    const btn = document.createElement("button");
    btn.className = "cal-day" + (inCurrentMonth ? "" : " other-month");
    btn.textContent = dateObj.getDate();
    btn.dataset.dateKey = key;

    if (key === dateKey(startOfToday())) {
      btn.classList.add("today");
    }

    if (getConfirmedPlayers(key).length > 0) {
      btn.classList.add("has-match");
    }

    if (currentPlayer && getConfirmedPlayers(key).includes(currentPlayer)) {
      btn.classList.add("playing-me");
    }

    if (currentPlayer && data[currentPlayer] && data[currentPlayer][key]) {
      btn.classList.add("available");
    }

    btn.addEventListener("click", () => {
      if (!currentPlayer) {
        calNote.textContent = "Kies eerst je naam hierboven.";
        return;
      }
      const isCurrentlyAvailable = !!(data[currentPlayer] && data[currentPlayer][key]);
      if (isCurrentlyAvailable && getConfirmedPlayers(key).includes(currentPlayer)) {
        calNote.textContent = "Je staat al ingepland voor een wedstrijd op deze dag — annuleer die eerst via \"Schema deze week\".";
        return;
      }
      if (!data[currentPlayer]) data[currentPlayer] = {};
      const newValue = !isCurrentlyAvailable;
      data[currentPlayer][key] = newValue;
      renderCalendar();
      renderWeekTable();
      saveDay(currentPlayer, key, newValue);
    });

    return btn;
  }

  function renderCalendar() {
    calMonthLabel.textContent = MONTH_NAMES[viewDate.getMonth()] + " " + viewDate.getFullYear();
    calGrid.innerHTML = "";

    prevMonthBtn.style.visibility =
      (viewDate.getFullYear() === currentMonthDate.getFullYear() && viewDate.getMonth() === currentMonthDate.getMonth())
        ? "hidden" : "visible";

    const year = viewDate.getFullYear();
    const month = viewDate.getMonth();
    const firstDay = new Date(year, month, 1);
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    let startOffset = firstDay.getDay() - 1;
    if (startOffset < 0) startOffset = 6;

    // Dagen van de vorige maand, om de eerste week aan te vullen
    const prevMonthDays = new Date(year, month, 0).getDate();
    for (let i = startOffset; i > 0; i--) {
      const d = new Date(year, month - 1, prevMonthDays - i + 1);
      calGrid.appendChild(makeDayButton(d, false));
    }

    for (let day = 1; day <= daysInMonth; day++) {
      const thisDate = new Date(year, month, day);
      calGrid.appendChild(makeDayButton(thisDate, true));
    }

    // Dagen van de volgende maand, om de laatste week aan te vullen
    const totalCells = startOffset + daysInMonth;
    const trailing = (7 - (totalCells % 7)) % 7;
    for (let i = 1; i <= trailing; i++) {
      const d = new Date(year, month + 1, i);
      calGrid.appendChild(makeDayButton(d, false));
    }

    highlightWeekInCalendar();
  }

  function highlightWeekInCalendar() {
    const weekKeys = new Set();
    for (let i = 0; i < 7; i++) {
      const d = new Date(weekViewDate);
      d.setDate(d.getDate() + i);
      weekKeys.add(dateKey(d));
    }
    calGrid.querySelectorAll(".cal-day").forEach(el => {
      if (weekKeys.has(el.dataset.dateKey)) {
        el.classList.add("in-week");
      } else {
        el.classList.remove("in-week");
      }
    });
  }

  function renderWeekTable() {
    const monday = weekViewDate;
    const sunday = new Date(monday);
    sunday.setDate(sunday.getDate() + 6);

    const fmt = (d) => d.getDate() + " " + MONTH_NAMES[d.getMonth()].slice(0,3);
    weekLabel.textContent = fmt(monday) + " – " + fmt(sunday);

    prevWeekBtn.style.visibility = (monday.getTime() === currentWeekMonday.getTime()) ? "hidden" : "visible";

    const weekDates = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(monday);
      d.setDate(d.getDate() + i);
      weekDates.push(d);
    }

    let html = "<thead><tr><th class=\"name-col\"></th>";
    weekDates.forEach((d, i) => {
      html += `<th>${DAY_SHORT[i]}<span>${d.getDate()}/${d.getMonth()+1}</span></th>`;
    });
    html += "</tr></thead><tbody>";

    PLAYERS.forEach(name => {
      html += `<tr><td class="name-col">${name}</td>`;
      weekDates.forEach((d, i) => {
        const key = dateKey(d);
        const isAvailable = data[name] && data[name][key];
        const isProposed = voorstelData[key] && voorstelData[key].includes(name);
        const isConfirmed = getConfirmedPlayers(key).includes(name);
        const cls = "week-cell" + (isConfirmed ? " confirmed" : (isProposed ? " proposed" : (isAvailable ? " available" : "")));
        html += `<td class="${cls}" data-date="${key}" data-player="${name}" title="${name} — ${DAY_LABELS[i]}"></td>`;
      });
      html += "</tr>";
    });
    html += "</tbody>";
    weekTable.innerHTML = html;

    const cornerCell = weekTable.querySelector("thead th.name-col");
    if (cornerCell) cornerCell.appendChild(inplannenBtn);
  }

  weekTable.addEventListener("click", (e) => {
    const cell = e.target.closest(".week-cell");
    if (!cell) return;
    toggleProposal(cell.dataset.date, cell.dataset.player);
  });

  async function toggleProposal(key, playerName) {
    if (getConfirmedPlayers(key).includes(playerName)) {
      weekNote.textContent = "Deze speler is al ingepland — annuleer eerst via \"Schema deze week\".";
      return;
    }

    const current = voorstelData[key] || [];
    const alreadyIn = current.includes(playerName);
    weekNote.textContent = "";

    try {
      await setDoc(voorstelDocRef, {
        [key]: alreadyIn ? arrayRemove(playerName) : arrayUnion(playerName)
      }, { merge: true });
    } catch (e) {
      weekNote.textContent = "Kon niet opslaan — controleer je internetverbinding.";
    }
  }

  document.getElementById("prevMonth").addEventListener("click", () => {
    if (viewDate.getFullYear() === currentMonthDate.getFullYear() && viewDate.getMonth() === currentMonthDate.getMonth()) return;
    viewDate.setMonth(viewDate.getMonth() - 1);
    renderCalendar();
    saveViewState();
  });

  document.getElementById("nextMonth").addEventListener("click", () => {
    viewDate.setMonth(viewDate.getMonth() + 1);
    renderCalendar();
    saveViewState();
  });

  function syncCalendarToWeek() {
    if (weekViewDate.getMonth() !== viewDate.getMonth() || weekViewDate.getFullYear() !== viewDate.getFullYear()) {
      viewDate = new Date(weekViewDate.getFullYear(), weekViewDate.getMonth(), 1);
      renderCalendar();
    } else {
      highlightWeekInCalendar();
    }
  }

  document.getElementById("prevWeek").addEventListener("click", () => {
    if (weekViewDate.getTime() === currentWeekMonday.getTime()) return;
    weekViewDate.setDate(weekViewDate.getDate() - 7);
    renderWeekTable();
    syncCalendarToWeek();
    saveViewState();
  });

  document.getElementById("nextWeek").addEventListener("click", () => {
    weekViewDate.setDate(weekViewDate.getDate() + 7);
    renderWeekTable();
    syncCalendarToWeek();
    saveViewState();
  });

  function renderMatches() {
    const todayKey = dateKey(startOfToday());
    const dateKeys = Object.keys(schemaData)
      .filter(k => schemaData[k] && schemaData[k].length > 0 && k >= todayKey)
      .sort();

    if (dateKeys.length === 0) {
      matchesContainer.innerHTML = "<p class=\"sub\">Speelschema nog inplannen</p>";
      return;
    }

    let html = "";
    dateKeys.forEach(key => {
      const [y, m, d] = key.split("-").map(Number);
      const dateObj = new Date(y, m - 1, d);
      const dayIdx = (dateObj.getDay() + 6) % 7;

      schemaData[key].forEach(match => {
        const players = match.players || [];
        const teamA = players.slice(0, 2);
        const teamB = players.slice(2, 4);
        const matchJson = JSON.stringify(match).replace(/"/g, "&quot;");
        const timeText = match.time ? match.time : "uur?";
        const timeCls = match.time ? "time-input" : "time-input placeholder";
        const courtText = match.court ? match.court : "terrein?";
        const courtCls = match.court ? "court-input" : "court-input placeholder";
        const baanText = match.baan ? match.baan : "T?";
        const baanCls = match.baan ? "court-input" : "court-input placeholder";

        function renderPlayer(name, idx) {
          const isBooker = match.booker === name;
          const isMe = currentPlayer === name;
          const sideCls = idx % 2 === 0 ? "badge-left" : "badge-right";
          const badge = isBooker
            ? `<span class="booker-badge ${sideCls}" draggable="true" data-date="${key}" data-id="${match.id}" title="Boekt het terrein">
                 <img src="tennisbal-badge.png" alt="Boekt het terrein" draggable="false">
               </span>`
            : "";
          return `<span class="player-wrap"><span class="player${isMe ? ' player-me' : ''}" draggable="true" data-date="${key}" data-id="${match.id}" data-idx="${idx}" data-name="${name}">${name}</span>${badge}</span>`;
        }

        html += `<div class="match">
          <div class="match-top">
            <div class="day">${DAY_SHORT[dayIdx].toUpperCase()}<span>${d}/${m}</span></div>
            <button class="${timeCls}" data-date="${key}" data-id="${match.id}" data-field="time">${timeText}</button>
            <button class="${courtCls}" data-date="${key}" data-id="${match.id}" data-field="court">${courtText}</button>
            <button class="${baanCls}" data-date="${key}" data-id="${match.id}" data-field="baan">${baanText}</button>
            <button class="cancel-match" data-date="${key}" data-match="${matchJson}" aria-label="Wedstrijd annuleren" title="Wedstrijd annuleren">✕</button>
          </div>
          <div class="court">
            <div class="team">${renderPlayer(teamA[0],0)}${renderPlayer(teamA[1],1)}</div>
            <span class="vs">VS</span>
            <div class="team">${renderPlayer(teamB[0],2)}${renderPlayer(teamB[1],3)}</div>
          </div>
        </div>`;
      });
    });
    matchesContainer.innerHTML = html;
  }

  matchesContainer.addEventListener("click", async (e) => {
    const cancelBtn = e.target.closest(".cancel-match");
    if (cancelBtn) {
      try {
        const matchObj = JSON.parse(cancelBtn.dataset.match.replace(/&quot;/g, "\""));
        await setDoc(schemaDocRef, { [cancelBtn.dataset.date]: arrayRemove(matchObj) }, { merge: true });
      } catch (err) {
        weekNote.textContent = "Kon niet annuleren — controleer je internetverbinding.";
      }
      return;
    }

    const timeBtn = e.target.closest(".time-input");
    if (timeBtn) {
      openTimePopup(timeBtn);
      return;
    }

    const courtBtn = e.target.closest(".court-input");
    if (courtBtn) {
      openCourtPopup(courtBtn);
      return;
    }
  });

  async function updateMatchField(dateKeyStr, matchId, field, value) {
    const matches = schemaData[dateKeyStr] || [];
    const updated = matches.map(m => m.id === matchId ? Object.assign({}, m, { [field]: value }) : m);
    schemaData[dateKeyStr] = updated;
    renderMatches();
    try {
      await setDoc(schemaDocRef, { [dateKeyStr]: updated }, { merge: true });
    } catch (e) {
      weekNote.textContent = "Kon niet opslaan — controleer je internetverbinding.";
    }
  }

  function chunkArray(arr, size) {
    const result = [];
    for (let i = 0; i < arr.length; i += size) {
      result.push(arr.slice(i, i + size));
    }
    return result;
  }

  function generateMatchId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  // Alle relevante wedstrijden (schema + geschiedenis) als platte lijst, met datum
  function getAllKnownMatches() {
    const all = [];
    [schemaData, geschiedenisData].forEach(source => {
      Object.keys(source).forEach(key => {
        (source[key] || []).forEach(m => all.push(Object.assign({ date: key }, m)));
      });
    });
    return all;
  }

  function daysBetween(keyA, keyB) {
    const [ya,ma,da] = keyA.split("-").map(Number);
    const [yb,mb,db] = keyB.split("-").map(Number);
    const diff = (new Date(ya,ma-1,da) - new Date(yb,mb-1,db)) / 86400000;
    return Math.abs(diff);
  }

  // Kiest de teamindeling (2v2) uit de 4 spelers die recent het minst samen speelden
  function bestPairing(fourPlayers, referenceDateKey) {
    const [a,b,c,d] = fourPlayers;
    const options = [
      [[a,b],[c,d]],
      [[a,c],[b,d]],
      [[a,d],[b,c]]
    ];
    const allMatches = getAllKnownMatches();

    function teammateScore(p1, p2) {
      let score = 0;
      allMatches.forEach(m => {
        const players = m.players || [];
        const sameTeam = (players[0]===p1 && players[1]===p2) || (players[0]===p2 && players[1]===p1) ||
                          (players[2]===p1 && players[3]===p2) || (players[2]===p2 && players[3]===p1);
        if (sameTeam) {
          const dagenGeleden = daysBetween(referenceDateKey, m.date) + 1;
          score += 1 / dagenGeleden;
        }
      });
      return score;
    }

    let scored = options.map(opt => ({
      opt,
      score: teammateScore(opt[0][0], opt[0][1]) + teammateScore(opt[1][0], opt[1][1])
    }));

    const minScore = Math.min(...scored.map(s => s.score));
    const bestOptions = scored.filter(s => s.score === minScore);
    const chosen = bestOptions[Math.floor(Math.random() * bestOptions.length)];
    return [chosen.opt[0], chosen.opt[1]];
  }

  // Bepaalt wie van de 4 spelers het terrein moet boeken, op basis van de beurtrol
  function pickBooker(fourPlayers, referenceDateKey, weekAlreadyBookedBy) {
    const allMatches = getAllKnownMatches();
    const historyLimitKey = dateKeyMonthsAgo(3);

    const candidates = fourPlayers.filter(p => !weekAlreadyBookedBy.includes(p));
    const pool = candidates.length > 0 ? candidates : fourPlayers;

    function lastBookedDaysAgo(player) {
      let mostRecent = null;
      allMatches.forEach(m => {
        if (m.date < historyLimitKey) return;
        if (m.booker === player) {
          if (mostRecent === null || m.date > mostRecent) mostRecent = m.date;
        }
      });
      return mostRecent === null ? Infinity : daysBetween(referenceDateKey, mostRecent);
    }

    let bestScore = -1;
    let bestPlayers = [];
    pool.forEach(p => {
      const score = lastBookedDaysAgo(p);
      if (score > bestScore) {
        bestScore = score;
        bestPlayers = [p];
      } else if (score === bestScore) {
        bestPlayers.push(p);
      }
    });

    return bestPlayers[Math.floor(Math.random() * bestPlayers.length)];
  }

  inplannenBtn.addEventListener("click", async () => {
    const weekDates = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(weekViewDate);
      d.setDate(d.getDate() + i);
      weekDates.push(dateKey(d));
    }

    const updates = {};
    let scheduledAny = false;
    let invalidDays = [];
    const weekBookings = []; // spelers die deze week al boeken toegewezen kregen (nieuw + reeds bestaand)

    weekDates.forEach(key => {
      getConfirmedPlayers(key).forEach(() => {}); // no-op, players zelf niet relevant hier
      (schemaData[key] || []).forEach(m => { if (m.booker) weekBookings.push(m.booker); });
    });

    weekDates.forEach(key => {
      const confirmed = getConfirmedPlayers(key);
      const newlyProposed = (voorstelData[key] || []).filter(p => !confirmed.includes(p));

      if (newlyProposed.length === 0) return;

      if (newlyProposed.length % 4 !== 0) {
        invalidDays.push(key.split("-").reverse().slice(0,2).join("/"));
        return;
      }

      const newMatches = chunkArray(newlyProposed, 4).map(chunk => {
        const [teamA, teamB] = bestPairing(chunk, key);
        const players = [...teamA, ...teamB];
        const booker = pickBooker(players, key, weekBookings);
        weekBookings.push(booker);
        return { id: generateMatchId(), players, booker };
      });
      updates[key] = arrayUnion(...newMatches);
      scheduledAny = true;
    });

    if (!scheduledAny && invalidDays.length === 0) {
      weekNote.textContent = "Duid eerst spelers aan in de tabel hierboven.";
      return;
    }

    try {
      if (scheduledAny) {
        await setDoc(schemaDocRef, updates, { merge: true });
      }
      if (invalidDays.length > 0) {
        weekNote.textContent = `Let op: ${invalidDays.join(", ")} nog geen veelvoud van 4 spelers.`;
      } else {
        weekNote.textContent = "";
      }
    } catch (e) {
      weekNote.textContent = "Kon niet inplannen — controleer je internetverbinding.";
    }
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }

  /* ===== UUR-KEYPAD ===== */
  const timePopup = document.getElementById("timePopup");
  const timePopupDisplay = document.getElementById("timePopupDisplay");
  let timeDigits = [];
  let timeEditTarget = null; // { date, id }

  function renderTimeDisplay() {
    const chars = ["-","-",":","-","-"];
    if (timeDigits[0] !== undefined) chars[0] = timeDigits[0];
    if (timeDigits[1] !== undefined) chars[1] = timeDigits[1];
    if (timeDigits[2] !== undefined) chars[3] = timeDigits[2];
    if (timeDigits[3] !== undefined) chars[4] = timeDigits[3];
    timePopupDisplay.textContent = chars.join("");
  }

  function positionPopup(popup, triggerEl) {
    const rect = triggerEl.getBoundingClientRect();
    const popupWidth = popup.offsetWidth || 220;
    let left = rect.left;
    if (left + popupWidth > window.innerWidth - 10) {
      left = window.innerWidth - popupWidth - 10;
    }
    if (left < 10) left = 10;
    popup.style.left = left + "px";
    let top = rect.bottom + 6;
    popup.style.top = top + "px";
  }

  function openTimePopup(triggerEl) {
    closeCourtPopup();
    timeEditTarget = { date: triggerEl.dataset.date, id: triggerEl.dataset.id };
    timeDigits = [];
    const current = matchesFieldValue(timeEditTarget, "time");
    if (current && /^\d{2}:\d{2}$/.test(current)) {
      timeDigits = [current[0], current[1], current[3], current[4]];
    }
    renderTimeDisplay();
    timePopup.classList.add("open");
    positionPopup(timePopup, triggerEl);
  }

  function closeTimePopup() {
    timePopup.classList.remove("open");
    timeEditTarget = null;
    timeDigits = [];
  }

  function matchesFieldValue(target, field) {
    if (!target) return null;
    const list = schemaData[target.date] || [];
    const m = list.find(x => x.id === target.id);
    return m ? m[field] : null;
  }

  function pressTimeDigit(d) {
    if (timeDigits.length >= 4) return;
    const pos = timeDigits.length;
    if (pos === 0 && !["0","1","2"].includes(d)) return;
    if (pos === 1 && timeDigits[0] === "2" && !["0","1","2","3","4"].includes(d)) return;
    if (pos === 2 && !["0","1","2","3","4","5"].includes(d)) return;
    timeDigits.push(d);
    renderTimeDisplay();
  }

  function pressTimeBackspace() {
    timeDigits.pop();
    renderTimeDisplay();
  }

  function pressTimeEnter() {
    if (timeDigits.length !== 4 || !timeEditTarget) return;
    const value = timeDigits[0] + timeDigits[1] + ":" + timeDigits[2] + timeDigits[3];
    const target = timeEditTarget;
    closeTimePopup();
    updateMatchField(target.date, target.id, "time", value);
  }

  timePopup.querySelectorAll(".keypad button").forEach(btn => {
    btn.addEventListener("click", () => {
      const key = btn.dataset.key;
      if (key === "back") pressTimeBackspace();
      else if (key === "enter") pressTimeEnter();
      else pressTimeDigit(key);
    });
  });

  /* ===== TERREIN-DROPDOWN ===== */
  const COURT_OPTIONS = ["TC Emblem", "FC Kampioenen", "TC Oase", "TC De Chalet", "TC 't SAS", "TC Molenbos"];
  const BAAN_OPTIONS = ["T1","T2","T3","T4","T5","T6","T7","T8","T9"];
  const courtPopup = document.getElementById("courtPopup");
  const courtOptionsList = document.getElementById("courtOptionsList");
  const courtOtherInput = document.getElementById("courtOtherInput");
  let courtEditTarget = null; // { date, id, field }

  function renderCourtOptions(options) {
    courtOptionsList.style.display = "block";
    courtOtherInput.style.display = "none";
    courtOtherInput.value = "";
    let html = "";
    options.forEach(opt => {
      html += `<button type="button" class="court-option" data-value="${opt}">${opt}</button>`;
    });
    html += `<button type="button" class="court-option" data-value="__other__">Andere…</button>`;
    courtOptionsList.innerHTML = html;
  }

  function openCourtPopup(triggerEl) {
    closeTimePopup();
    const field = triggerEl.dataset.field;
    courtEditTarget = { date: triggerEl.dataset.date, id: triggerEl.dataset.id, field: field };
    renderCourtOptions(field === "baan" ? BAAN_OPTIONS : COURT_OPTIONS);
    courtPopup.classList.add("open");
    positionPopup(courtPopup, triggerEl);
  }

  function closeCourtPopup() {
    courtPopup.classList.remove("open");
    courtEditTarget = null;
  }

  courtOptionsList.addEventListener("click", (e) => {
    const opt = e.target.closest(".court-option");
    if (!opt || !courtEditTarget) return;
    if (opt.dataset.value === "__other__") {
      courtOptionsList.style.display = "none";
      courtOtherInput.style.display = "block";
      courtOtherInput.focus();
      return;
    }
    const target = courtEditTarget;
    const value = opt.dataset.value;
    closeCourtPopup();
    updateMatchField(target.date, target.id, target.field, value);
  });

  courtOtherInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      const value = courtOtherInput.value.trim();
      if (!value || !courtEditTarget) return;
      const target = courtEditTarget;
      closeCourtPopup();
      updateMatchField(target.date, target.id, target.field, value);
    } else if (e.key === "Escape") {
      closeCourtPopup();
    }
  });

  /* ===== Gedeelde sluitlogica (buiten klikken / fysiek toetsenbord) ===== */
  document.addEventListener("click", (e) => {
    if (timePopup.classList.contains("open") && !timePopup.contains(e.target) && !e.target.closest(".time-input")) {
      closeTimePopup();
    }
    if (courtPopup.classList.contains("open") && !courtPopup.contains(e.target) && !e.target.closest(".court-input")) {
      closeCourtPopup();
    }
  });

  document.addEventListener("keydown", (e) => {
    if (timePopup.classList.contains("open")) {
      if (/^[0-9]$/.test(e.key)) { pressTimeDigit(e.key); e.preventDefault(); }
      else if (e.key === "Backspace") { pressTimeBackspace(); e.preventDefault(); }
      else if (e.key === "Enter") { pressTimeEnter(); e.preventDefault(); }
      else if (e.key === "Escape") { closeTimePopup(); }
    }
  });

  /* ===== DRAG & DROP: spelers wisselen van team ===== */
  let draggedPlayer = null; // { date, id, idx, name }
  let draggedBooker = null; // { date, id }

  matchesContainer.addEventListener("dragstart", (e) => {
    const pill = e.target.closest(".player");
    if (pill) {
      draggedPlayer = {
        date: pill.dataset.date,
        id: pill.dataset.id,
        idx: parseInt(pill.dataset.idx, 10),
        name: pill.dataset.name
      };
      pill.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      return;
    }
    const badge = e.target.closest(".booker-badge");
    if (badge) {
      draggedBooker = { date: badge.dataset.date, id: badge.dataset.id };
      e.dataTransfer.effectAllowed = "move";
    }
  });

  matchesContainer.addEventListener("dragend", (e) => {
    const pill = e.target.closest(".player");
    if (pill) pill.classList.remove("dragging");
    matchesContainer.querySelectorAll(".drag-over").forEach(el => el.classList.remove("drag-over"));
  });

  matchesContainer.addEventListener("dragover", (e) => {
    if (e.target.closest(".player") || e.target.closest(".booker-badge")) {
      e.preventDefault();
    }
  });

  matchesContainer.addEventListener("dragenter", (e) => {
    const target = e.target.closest(".player") || e.target.closest(".booker-badge");
    if (target) target.classList.add("drag-over");
  });

  matchesContainer.addEventListener("dragleave", (e) => {
    const target = e.target.closest(".player") || e.target.closest(".booker-badge");
    if (target) target.classList.remove("drag-over");
  });

  matchesContainer.addEventListener("drop", async (e) => {
    e.preventDefault();

    const dropPill = e.target.closest(".player");
    if (dropPill && draggedPlayer) {
      dropPill.classList.remove("drag-over");
      const targetIdx = parseInt(dropPill.dataset.idx, 10);
      const targetDate = dropPill.dataset.date;
      const targetId = dropPill.dataset.id;

      if (targetDate === draggedPlayer.date && targetId === draggedPlayer.id && targetIdx !== draggedPlayer.idx) {
        const matches = schemaData[targetDate] || [];
        const match = matches.find(m => m.id === targetId);
        if (match) {
          const newPlayers = match.players.slice();
          const tmp = newPlayers[draggedPlayer.idx];
          newPlayers[draggedPlayer.idx] = newPlayers[targetIdx];
          newPlayers[targetIdx] = tmp;
          await updateMatchField(targetDate, targetId, "players", newPlayers);
        }
      }
      draggedPlayer = null;
      return;
    }

    const dropBadgeTarget = e.target.closest(".player") || e.target.closest(".booker-badge");
    if (dropBadgeTarget && draggedBooker) {
      dropBadgeTarget.classList.remove("drag-over");
      const targetDate = dropBadgeTarget.dataset.date;
      const targetId = dropBadgeTarget.dataset.id;
      const targetName = dropBadgeTarget.dataset.name || null;

      if (targetDate === draggedBooker.date && targetId === draggedBooker.id && targetName) {
        await updateMatchField(targetDate, targetId, "booker", targetName);
      }
      draggedBooker = null;
    }
  });
</script>
