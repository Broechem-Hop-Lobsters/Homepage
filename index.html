<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Broechem Hop Lobsters — Weekschema</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A0A0A">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hop Lobsters">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --court: #14433D;
    --court-dark: #0C2C28;
    --hero-black: #0A0A0A;
    --ball: #D6F52C;
    --clay: #EFE6D6;
    --ink: #12201C;
    --white: #FDFCF9;
    --line: rgba(253,252,249,0.25);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Work Sans', sans-serif;
    background: var(--clay);
    color: var(--ink);
    line-height: 1.5;
  }

  h1, h2, h3 {
    font-family: 'Archivo Black', sans-serif;
    text-transform: uppercase;
    letter-spacing: -0.01em;
  }

  /* HERO */
  .hero {
    background: var(--hero-black);
    color: var(--white);
    padding: 0.75rem 1.5rem;
    height: 50vh;
    min-height: 280px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .hero-inner {
    position: relative;
    max-width: 780px;
    margin: 0 auto;
    text-align: center;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .hero-logo {
    height: 100%;
    max-height: 100%;
    width: auto;
    max-width: 90vw;
    object-fit: contain;
    filter: drop-shadow(0 20px 30px rgba(0,0,0,0.5));
  }

  /* SCHEDULE */
  .schedule {
    max-width: 1000px;
    margin: 2.5rem auto 0;
    padding: 0 1.5rem 4rem;
    position: relative;
  }

  .schedule-card {
    background: var(--white);
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(20,67,61,0.18);
    padding: 2.5rem;
  }

  .schedule-card h2 {
    font-size: 1.4rem;
    margin-bottom: 0.3rem;
  }

  .schedule-card .sub {
    color: #6b6459;
    margin-bottom: 2rem;
    font-size: 0.95rem;
  }

  .matches {
    display: grid;
    gap: 1.4rem;
  }

  .match {
    display: grid;
    grid-template-columns: 90px 1fr auto;
    gap: 1.2rem;
    align-items: center;
    border: 1px solid #E4DBC8;
    border-radius: 14px;
    padding: 1.2rem;
  }

  .cancel-match {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: #E4534B;
    color: var(--white);
    font-size: 0.9rem;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease;
    flex-shrink: 0;
  }

  .cancel-match:hover {
    background: #C43E37;
  }

  .match .day {
    font-family: 'Archivo Black', sans-serif;
    text-transform: uppercase;
    font-size: 0.95rem;
    color: var(--court);
    text-align: center;
    line-height: 1.1;
  }

  .match .day span {
    display: block;
    font-size: 0.7rem;
    color: #8a8375;
    margin-top: 0.2rem;
  }

  .court {
    position: relative;
    background: var(--court);
    border-radius: 10px;
    padding: 0.9rem 1.2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: var(--white);
    overflow: hidden;
  }

  .court::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 8%;
    bottom: 8%;
    width: 2px;
    background: var(--line);
  }

  .team {
    display: flex;
    gap: 0.6rem;
    z-index: 1;
  }

  .player {
    background: rgba(253,252,249,0.1);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.35rem 0.85rem;
    font-size: 0.85rem;
    font-weight: 600;
  }

  .vs {
    color: var(--ball);
    font-family: 'Archivo Black', sans-serif;
    font-size: 0.75rem;
    z-index: 1;
    padding: 0 0.5rem;
  }

  /* INFO */
  .info {
    max-width: 1000px;
    margin: 0 auto;
    padding: 0 1.5rem 5rem;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.5rem;
  }

  .info-card {
    background: var(--white);
    border-radius: 16px;
    padding: 1.6rem;
    border: 1px solid #E4DBC8;
  }

  .info-card .num {
    font-family: 'Archivo Black', sans-serif;
    color: var(--ball);
    -webkit-text-stroke: 1.5px var(--court);
    font-size: 1.8rem;
    margin-bottom: 0.5rem;
  }

  .info-card h3 {
    font-size: 0.95rem;
    margin-bottom: 0.4rem;
  }

  .info-card p {
    font-size: 0.88rem;
    color: #6b6459;
  }

  /* AVAILABILITY */
  .availability {
    width: 100%;
    margin: 0;
    padding: 0;
  }

  .availability-card {
    background: var(--white);
    width: 100%;
    padding: 1.3rem 0;
    box-shadow: inset 0 1px 0 #E4DBC8, inset 0 -1px 0 #E4DBC8;
  }

  .availability-inner {
    max-width: 1450px;
    margin: 0 auto;
    padding: 0 1.5rem;
  }

  .availability-group {
    display: grid;
    grid-template-columns: 480px 620px;
    column-gap: 12rem;
    row-gap: 1.6rem;
    align-items: stretch;
    width: fit-content;
    margin: 0 auto;
  }

  .player-picker {
    grid-column: 1 / -1;
    grid-row: 1;
  }

  .availability-left {
    grid-column: 1;
    grid-row: 2;
    display: flex;
    flex-direction: column;
  }

  .cal-column {
    max-width: 480px;
    width: 480px;
  }

  .week-table-column {
    grid-column: 2;
    grid-row: 1 / 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100%;
  }

  .week-table-inner {
    width: 100%;
    max-width: 620px;
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  .week-table-wrap {
    flex: 1;
  }

  .week-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.8rem;
  }

  .week-label {
    font-family: 'Archivo Black', sans-serif;
    text-transform: uppercase;
    font-size: 1.15rem;
    color: var(--court);
  }

  .week-table {
    width: 100%;
    height: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }

  .week-table th, .week-table td {
    text-align: center;
    padding: 0;
    border: 1px solid #000;
  }

  .week-table thead th {
    font-size: 0.78rem;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--court);
    background: var(--clay);
    line-height: 1.2;
    padding: 0.5rem 0.2rem;
  }

  .week-table thead th span {
    display: block;
    font-size: 0.7rem;
    font-weight: 400;
    color: #8a8375;
  }

  .week-table .name-col {
    width: 24%;
    text-align: left;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--ink);
    background: var(--clay);
    padding: 0.4rem 0.6rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  thead .name-col {
    background: var(--clay);
  }

  .week-cell {
    height: 2.6rem;
    background: var(--white);
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .week-cell:hover {
    background: #EFE9DC;
  }

  .week-cell.available {
    background: #C7F0C2;
  }

  .week-cell.proposed {
    background: #FBD2A1;
  }

  .week-cell.confirmed {
    background: #DA8B93;
  }

  .week-cell.available:hover,
  .week-cell.proposed:hover,
  .week-cell.confirmed:hover {
    filter: brightness(0.95);
  }

  .week-actions-bar {
    max-width: 1450px;
    margin: 0 auto;
    padding: 0 1.5rem 3rem;
  }

  .week-actions-inner {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 1rem;
  }

  .week-note {
    font-size: 0.85rem;
    color: #6b6459;
    margin: 0;
  }

  .btn-inplannen {
    background: var(--court);
    color: var(--white);
    border: none;
    font-family: 'Archivo Black', sans-serif;
    text-transform: uppercase;
    font-size: 0.85rem;
    letter-spacing: 0.02em;
    padding: 0.8rem 1.8rem;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .btn-inplannen:hover {
    background: var(--court-dark);
  }

  .week-table thead th.name-col {
    padding: 0.4rem;
    background: var(--white);
    border-top: none;
    border-left: none;
    text-align: center;
    vertical-align: middle;
  }

  .btn-inplannen-cell {
    background: var(--court);
    color: var(--white);
    border: none;
    font-family: 'Archivo Black', sans-serif;
    text-transform: uppercase;
    font-size: 0.72rem;
    letter-spacing: 0.01em;
    padding: 0 1.1rem;
    height: 100%;
    box-sizing: border-box;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .btn-inplannen-cell:hover {
    background: var(--court-dark);
  }

  @media (max-width: 640px) {
    .btn-inplannen-cell {
      height: auto;
      padding: 0.4rem 0.8rem;
      font-size: 0.55rem;
    }
  }

  .availability-card h2 {
    font-size: 1.35rem;
    margin-bottom: 0.15rem;
  }

  .availability-card .sub {
    color: #6b6459;
    margin-bottom: 0.8rem;
    font-size: 0.92rem;
  }

  .player-picker {
    display: flex;
    flex-wrap: nowrap;
    gap: 0.35rem;
    overflow-x: auto;
  }

  .player-pill {
    border: 1.5px solid #000;
    background: var(--clay);
    color: var(--ink);
    font-weight: 600;
    font-size: 0.78rem;
    padding: 0.34rem 0.7rem;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .player-pill:hover {
    border-color: var(--court);
  }

  .player-pill.active {
    background: #C7F0C2;
    border-color: #000;
    color: var(--ink);
  }

  .cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.6rem;
  }

  .cal-nav {
    background: var(--court);
    color: var(--white);
    border: none;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    font-size: 1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s ease;
  }

  .cal-nav:hover {
    background: var(--court-dark);
  }

  .cal-month-label {
    font-family: 'Archivo Black', sans-serif;
    text-transform: uppercase;
    font-size: 0.95rem;
    color: var(--court);
  }

  .cal-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 0.35rem;
    margin-bottom: 0.3rem;
  }

  .cal-weekdays span {
    text-align: center;
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    color: #8a8375;
  }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 0.35rem;
  }

  .cal-day {
    aspect-ratio: 5 / 3;
    border: 1.5px solid #000;
    background: var(--clay);
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .cal-day:hover {
    border-color: var(--court);
  }

  .cal-day.empty {
    background: transparent;
    border: none;
    cursor: default;
  }

  .cal-day.other-month {
    background: var(--white);
    border-color: #000;
    color: #b0a894;
  }

  .cal-day.other-month:hover {
    border-color: var(--court);
  }

  .cal-day.in-week {
    background: #DECBA0;
    border-color: #000;
  }

  .cal-day.available {
    background: #C7F0C2;
    border-color: #000;
    color: var(--ink);
  }

  .cal-note {
    margin-top: 0.6rem;
    font-size: 0.78rem;
    color: #8a8375;
  }

  footer {
    text-align: center;
    padding: 2.5rem 1.5rem;
    font-size: 0.85rem;
    color: #8a8375;
  }

  @media (max-width: 640px) {
    .match { grid-template-columns: 1fr; }
    .match .day { text-align: left; }
    .court { flex-direction: column; gap: 0.7rem; align-items: flex-start; }
    .court::after { display: none; }
    .info { grid-template-columns: 1fr; }
    .availability-inner { padding: 0 1rem; }
    .cal-day { font-size: 0.7rem; }
    .availability-group { grid-template-columns: 1fr; width: 100%; margin: 0; }
    .player-picker { grid-column: 1; grid-row: 1; }
    .availability-left { grid-column: 1; grid-row: 2; }
    .week-table-column { grid-column: 1; grid-row: 3; }
    .cal-column, .week-table-column { max-width: 100%; width: 100%; height: auto; }
    .week-table-inner { max-width: 100%; height: auto; }
    .week-table-column { margin-top: 1.5rem; }
    .week-table { height: auto; }
    .week-cell { height: 2.6rem; }
  }
  .login-picker {
    display: flex;
    flex-wrap: nowrap;
    justify-content: space-between;
    gap: 0.7rem;
    padding: 0.5rem 0;
  }

  .login-pill {
    border: 1.5px solid #000;
    background: var(--clay);
    color: var(--ink);
    font-weight: 700;
    font-size: 1.05rem;
    padding: 0.85rem 1rem;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
    flex: 1;
    text-align: center;
  }

  .login-pill:hover {
    border-color: var(--court);
    background: #E4DBC8;
  }

  @media (max-width: 640px) {
    .login-picker { flex-wrap: wrap; }
    .login-pill { flex: 1 1 40%; font-size: 0.9rem; padding: 0.7rem 0.8rem; }
  }
</style>
</head>
<body>

<div id="loginView">

<section class="hero">
  <div class="hero-inner">
    <img class="hero-logo" src="hoplobsters-logo.png" alt="Broechem Hop Lobsters logo">
  </div>
</section>

<section class="schedule">
  <div class="schedule-card">
    <h2>Aanmelden</h2>
    <p class="sub"></p>
    <div class="login-picker" id="loginPicker"></div>
  </div>
</section>

</div>

<div id="appView" style="display:none;">

<section class="hero">
  <div class="hero-inner">
    <img class="hero-logo" src="hoplobsters-logo.png" alt="Broechem Hop Lobsters logo">
  </div>
</section>

<section class="schedule">
  <div class="schedule-card">
    <h2>Schema deze week</h2>
    <p class="sub">Voorbeeldindeling — pas de namen en dagen aan naar jullie eigen poll-resultaat.</p>
    <div class="matches" id="matchesContainer"></div>
  </div>
</section>

<section class="availability">
  <div class="availability-card">
    <div class="availability-inner">
      <div class="availability-group">
        <div class="player-picker" id="playerPicker"></div>

        <div class="availability-left">
          <h2>Beschikbaarheid</h2>
          <p class="sub"></p>

          <div class="cal-column">
            <div class="cal-header">
              <button class="cal-nav" id="prevMonth" aria-label="Vorige maand">‹</button>
              <span class="cal-month-label" id="calMonthLabel"></span>
              <button class="cal-nav" id="nextMonth" aria-label="Volgende maand">›</button>
            </div>

            <div class="cal-weekdays">
              <span>Ma</span><span>Di</span><span>Wo</span><span>Do</span><span>Vr</span><span>Za</span><span>Zo</span>
            </div>

            <div class="cal-grid" id="calGrid"></div>

            <p class="cal-note" id="calNote"></p>
          </div>
        </div>

        <div class="week-table-column">
          <div class="week-table-inner">
            <div class="week-header">
              <button class="cal-nav" id="prevWeek" aria-label="Vorige week">‹</button>
              <span class="week-label" id="weekLabel"></span>
              <button class="cal-nav" id="nextWeek" aria-label="Volgende week">›</button>
            </div>
            <div class="week-table-wrap">
              <table class="week-table" id="weekTable"></table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="week-actions-bar">
  <div class="week-actions-inner">
    <p class="week-note" id="weekNote"></p>
    <button class="btn-inplannen-cell" id="inplannenBtn">Inplannen</button>
  </div>
</section>

<footer>
</footer>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, onSnapshot, arrayUnion, arrayRemove, deleteField } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB-KnfhkZpEaJFCZuGqvGZ289QfH69Et1U",
    authDomain: "broechem-hop-lobsters.firebaseapp.com",
    projectId: "broechem-hop-lobsters",
    storageBucket: "broechem-hop-lobsters.firebasestorage.app",
    messagingSenderId: "829408587300",
    appId: "1:829408587300:web:6d4a80b2e7a05a92fd32b1"
  };

  const firebaseApp = initializeApp(firebaseConfig);
  const auth = getAuth(firebaseApp);
  const db = getFirestore(firebaseApp);
  const availabilityDocRef = doc(db, "padel", "beschikbaarheid");
  const voorstelDocRef = doc(db, "padel", "voorstel");
  const schemaDocRef = doc(db, "padel", "schema");

  const PLAYERS = ["Kristof", "Kenny", "Kevin", "Ken", "Sven", "Jurgen", "Bert", "Guido"];
  const MONTH_NAMES = ["Januari","Februari","Maart","April","Mei","Juni","Juli","Augustus","September","Oktober","November","December"];

  let data = {};
  let voorstelData = {};
  let schemaData = {};

  let currentPlayer = null;
  let viewDate = new Date();
  viewDate.setDate(1);

  const playerPicker = document.getElementById("playerPicker");
  const loginPicker = document.getElementById("loginPicker");
  const loginView = document.getElementById("loginView");
  const appView = document.getElementById("appView");
  const calGrid = document.getElementById("calGrid");
  const calMonthLabel = document.getElementById("calMonthLabel");
  const calNote = document.getElementById("calNote");
  const weekTable = document.getElementById("weekTable");
  const weekLabel = document.getElementById("weekLabel");
  const weekNote = document.getElementById("weekNote");
  const inplannenBtn = document.getElementById("inplannenBtn");
  const matchesContainer = document.getElementById("matchesContainer");

  const DAY_LABELS = ["Maandag","Dinsdag","Woensdag","Donderdag","Vrijdag","Zaterdag","Zondag"];
  const DAY_SHORT = ["Ma","Di","Wo","Do","Vr","Za","Zo"];

  let weekViewDate = getMonday(new Date());

  function getMonday(d) {
    const date = new Date(d);
    const day = date.getDay();
    const diff = day === 0 ? -6 : 1 - day;
    date.setDate(date.getDate() + diff);
    date.setHours(0,0,0,0);
    return date;
  }

  function renderLoginPicker() {
    loginPicker.innerHTML = "";
    PLAYERS.forEach(name => {
      const pill = document.createElement("button");
      pill.className = "login-pill";
      pill.textContent = name;
      pill.addEventListener("click", () => {
        currentPlayer = name;
        loginView.style.display = "none";
        appView.style.display = "";
        renderPlayerPicker();
        renderCalendar();
        renderWeekTable();
        calNote.textContent = "Klik op een dag om je beschikbaarheid aan/uit te zetten.";
      });
      loginPicker.appendChild(pill);
    });
  }

  async function saveDay(playerName, key, newValue) {
    try {
      await setDoc(availabilityDocRef, { [playerName]: { [key]: newValue } }, { merge: true });
    } catch (e) {
      calNote.textContent = "Kon niet opslaan — controleer je internetverbinding.";
    }
  }

  // Aanmelden (onzichtbaar, geen inlogscherm) en dan pas de app opstarten
  onAuthStateChanged(auth, (user) => {
    if (user) {
      startApp();
    }
  });
  signInAnonymously(auth).catch(() => {
    calNote.textContent = "Kon niet verbinden met de gedeelde beschikbaarheid.";
  });

  let appStarted = false;
  function startApp() {
    if (appStarted) return;
    appStarted = true;

    renderLoginPicker();

    // Live meeluisteren: zodra iemand anders iets aanklikt, werkt dit automatisch bij
    onSnapshot(availabilityDocRef, (snap) => {
      data = snap.exists() ? snap.data() : {};
      renderCalendar();
      renderWeekTable();
    });

    onSnapshot(voorstelDocRef, (snap) => {
      voorstelData = snap.exists() ? snap.data() : {};
      renderWeekTable();
    });

    onSnapshot(schemaDocRef, (snap) => {
      schemaData = snap.exists() ? snap.data() : {};
      renderMatches();
      renderWeekTable();
    });

    renderPlayerPicker();
    renderCalendar();
    renderWeekTable();
    renderMatches();
  }

  function renderPlayerPicker() {
    playerPicker.innerHTML = "";
    PLAYERS.forEach(name => {
      const pill = document.createElement("button");
      pill.className = "player-pill" + (name === currentPlayer ? " active" : "");
      pill.textContent = name;
      pill.addEventListener("click", () => {
        currentPlayer = name;
        renderPlayerPicker();
        renderCalendar();
        calNote.textContent = "Klik op een dag om je beschikbaarheid aan/uit te zetten.";
      });
      playerPicker.appendChild(pill);
    });
  }

  function dateKey(d) {
    return d.getFullYear() + "-" + (d.getMonth()+1).toString().padStart(2,"0") + "-" + d.getDate().toString().padStart(2,"0");
  }

  function getConfirmedPlayers(key) {
    const matches = schemaData[key] || [];
    return matches.flatMap(m => m.players || []);
  }

  function makeDayButton(dateObj, inCurrentMonth) {
    const key = dateKey(dateObj);
    const btn = document.createElement("button");
    btn.className = "cal-day" + (inCurrentMonth ? "" : " other-month");
    btn.textContent = dateObj.getDate();
    btn.dataset.dateKey = key;

    if (currentPlayer && data[currentPlayer] && data[currentPlayer][key]) {
      btn.classList.add("available");
    }

    btn.addEventListener("click", () => {
      if (!currentPlayer) {
        calNote.textContent = "Kies eerst je naam hierboven.";
        return;
      }
      const isCurrentlyAvailable = !!(data[currentPlayer] && data[currentPlayer][key]);
      if (isCurrentlyAvailable && getConfirmedPlayers(key).includes(currentPlayer)) {
        calNote.textContent = "Je staat al ingepland voor een wedstrijd op deze dag — annuleer die eerst via \"Schema deze week\".";
        return;
      }
      if (!data[currentPlayer]) data[currentPlayer] = {};
      const newValue = !isCurrentlyAvailable;
      data[currentPlayer][key] = newValue;
      renderCalendar();
      renderWeekTable();
      saveDay(currentPlayer, key, newValue);
    });

    return btn;
  }

  function renderCalendar() {
    calMonthLabel.textContent = MONTH_NAMES[viewDate.getMonth()] + " " + viewDate.getFullYear();
    calGrid.innerHTML = "";

    const year = viewDate.getFullYear();
    const month = viewDate.getMonth();
    const firstDay = new Date(year, month, 1);
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    let startOffset = firstDay.getDay() - 1;
    if (startOffset < 0) startOffset = 6;

    // Dagen van de vorige maand, om de eerste week aan te vullen
    const prevMonthDays = new Date(year, month, 0).getDate();
    for (let i = startOffset; i > 0; i--) {
      const d = new Date(year, month - 1, prevMonthDays - i + 1);
      calGrid.appendChild(makeDayButton(d, false));
    }

    for (let day = 1; day <= daysInMonth; day++) {
      const thisDate = new Date(year, month, day);
      calGrid.appendChild(makeDayButton(thisDate, true));
    }

    // Dagen van de volgende maand, om de laatste week aan te vullen
    const totalCells = startOffset + daysInMonth;
    const trailing = (7 - (totalCells % 7)) % 7;
    for (let i = 1; i <= trailing; i++) {
      const d = new Date(year, month + 1, i);
      calGrid.appendChild(makeDayButton(d, false));
    }

    highlightWeekInCalendar();
  }

  function highlightWeekInCalendar() {
    const weekKeys = new Set();
    for (let i = 0; i < 7; i++) {
      const d = new Date(weekViewDate);
      d.setDate(d.getDate() + i);
      weekKeys.add(dateKey(d));
    }
    calGrid.querySelectorAll(".cal-day").forEach(el => {
      if (weekKeys.has(el.dataset.dateKey)) {
        el.classList.add("in-week");
      } else {
        el.classList.remove("in-week");
      }
    });
  }

  function renderWeekTable() {
    const monday = weekViewDate;
    const sunday = new Date(monday);
    sunday.setDate(sunday.getDate() + 6);

    const fmt = (d) => d.getDate() + " " + MONTH_NAMES[d.getMonth()].slice(0,3);
    weekLabel.textContent = fmt(monday) + " – " + fmt(sunday);

    const weekDates = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(monday);
      d.setDate(d.getDate() + i);
      weekDates.push(d);
    }

    let html = "<thead><tr><th class=\"name-col\"></th>";
    weekDates.forEach((d, i) => {
      html += `<th>${DAY_SHORT[i]}<span>${d.getDate()}/${d.getMonth()+1}</span></th>`;
    });
    html += "</tr></thead><tbody>";

    PLAYERS.forEach(name => {
      html += `<tr><td class="name-col">${name}</td>`;
      weekDates.forEach((d, i) => {
        const key = dateKey(d);
        const isAvailable = data[name] && data[name][key];
        const isProposed = voorstelData[key] && voorstelData[key].includes(name);
        const isConfirmed = getConfirmedPlayers(key).includes(name);
        const cls = "week-cell" + (isConfirmed ? " confirmed" : (isProposed ? " proposed" : (isAvailable ? " available" : "")));
        html += `<td class="${cls}" data-date="${key}" data-player="${name}" title="${name} — ${DAY_LABELS[i]}"></td>`;
      });
      html += "</tr>";
    });
    html += "</tbody>";
    weekTable.innerHTML = html;

    const cornerCell = weekTable.querySelector("thead th.name-col");
    if (cornerCell) cornerCell.appendChild(inplannenBtn);
  }

  weekTable.addEventListener("click", (e) => {
    const cell = e.target.closest(".week-cell");
    if (!cell) return;
    toggleProposal(cell.dataset.date, cell.dataset.player);
  });

  async function toggleProposal(key, playerName) {
    if (getConfirmedPlayers(key).includes(playerName)) {
      weekNote.textContent = "Deze speler is al ingepland — annuleer eerst via \"Schema deze week\".";
      return;
    }

    const current = voorstelData[key] || [];
    const alreadyIn = current.includes(playerName);
    weekNote.textContent = "";

    try {
      await setDoc(voorstelDocRef, {
        [key]: alreadyIn ? arrayRemove(playerName) : arrayUnion(playerName)
      }, { merge: true });
    } catch (e) {
      weekNote.textContent = "Kon niet opslaan — controleer je internetverbinding.";
    }
  }

  document.getElementById("prevMonth").addEventListener("click", () => {
    viewDate.setMonth(viewDate.getMonth() - 1);
    renderCalendar();
  });

  document.getElementById("nextMonth").addEventListener("click", () => {
    viewDate.setMonth(viewDate.getMonth() + 1);
    renderCalendar();
  });

  function syncCalendarToWeek() {
    if (weekViewDate.getMonth() !== viewDate.getMonth() || weekViewDate.getFullYear() !== viewDate.getFullYear()) {
      viewDate = new Date(weekViewDate.getFullYear(), weekViewDate.getMonth(), 1);
      renderCalendar();
    } else {
      highlightWeekInCalendar();
    }
  }

  document.getElementById("prevWeek").addEventListener("click", () => {
    weekViewDate.setDate(weekViewDate.getDate() - 7);
    renderWeekTable();
    syncCalendarToWeek();
  });

  document.getElementById("nextWeek").addEventListener("click", () => {
    weekViewDate.setDate(weekViewDate.getDate() + 7);
    renderWeekTable();
    syncCalendarToWeek();
  });

  function renderMatches() {
    const dateKeys = Object.keys(schemaData)
      .filter(k => schemaData[k] && schemaData[k].length > 0)
      .sort();

    if (dateKeys.length === 0) {
      matchesContainer.innerHTML = "<p class=\"sub\">Nog geen wedstrijden ingepland — stel hieronder een schema samen en klik op \"Inplannen\".</p>";
      return;
    }

    let html = "";
    dateKeys.forEach(key => {
      const [y, m, d] = key.split("-").map(Number);
      const dateObj = new Date(y, m - 1, d);
      const dayIdx = (dateObj.getDay() + 6) % 7;

      schemaData[key].forEach(match => {
        const players = match.players || [];
        const teamA = players.slice(0, 2);
        const teamB = players.slice(2, 4);
        const matchJson = JSON.stringify(match).replace(/"/g, "&quot;");

        html += `<div class="match">
          <div class="day">${DAY_SHORT[dayIdx].toUpperCase()}<span>${d}/${m}</span></div>
          <div class="court">
            <div class="team">${teamA.map(n => `<span class="player">${n}</span>`).join("")}</div>
            <span class="vs">VS</span>
            <div class="team">${teamB.map(n => `<span class="player">${n}</span>`).join("")}</div>
          </div>
          <button class="cancel-match" data-date="${key}" data-match="${matchJson}" aria-label="Wedstrijd annuleren" title="Wedstrijd annuleren">✕</button>
        </div>`;
      });
    });
    matchesContainer.innerHTML = html;
  }

  matchesContainer.addEventListener("click", async (e) => {
    const btn = e.target.closest(".cancel-match");
    if (!btn) return;
    try {
      const matchObj = JSON.parse(btn.dataset.match.replace(/&quot;/g, "\""));
      await setDoc(schemaDocRef, { [btn.dataset.date]: arrayRemove(matchObj) }, { merge: true });
    } catch (err) {
      weekNote.textContent = "Kon niet annuleren — controleer je internetverbinding.";
    }
  });

  function chunkArray(arr, size) {
    const result = [];
    for (let i = 0; i < arr.length; i += size) {
      result.push(arr.slice(i, i + size));
    }
    return result;
  }

  function generateMatchId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  inplannenBtn.addEventListener("click", async () => {
    const weekDates = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(weekViewDate);
      d.setDate(d.getDate() + i);
      weekDates.push(dateKey(d));
    }

    const updates = {};
    let scheduledAny = false;
    let invalidDays = [];

    weekDates.forEach(key => {
      const confirmed = getConfirmedPlayers(key);
      const newlyProposed = (voorstelData[key] || []).filter(p => !confirmed.includes(p));

      if (newlyProposed.length === 0) return;

      if (newlyProposed.length % 4 !== 0) {
        invalidDays.push(key.split("-").reverse().slice(0,2).join("/"));
        return;
      }

      const newMatches = chunkArray(newlyProposed, 4).map(chunk => ({ id: generateMatchId(), players: chunk }));
      updates[key] = arrayUnion(...newMatches);
      scheduledAny = true;
    });

    if (!scheduledAny && invalidDays.length === 0) {
      weekNote.textContent = "Duid eerst spelers aan in de tabel hierboven.";
      return;
    }

    try {
      if (scheduledAny) {
        await setDoc(schemaDocRef, updates, { merge: true });
      }
      if (invalidDays.length > 0) {
        weekNote.textContent = scheduledAny
          ? `Ingepland! Let op: ${invalidDays.join(", ")} nog geen veelvoud van 4 spelers.`
          : `Nog geen veelvoud van 4 spelers op: ${invalidDays.join(", ")}.`;
      } else {
        weekNote.textContent = "Ingepland! Zie \"Schema deze week\" bovenaan.";
      }
    } catch (e) {
      weekNote.textContent = "Kon niet inplannen — controleer je internetverbinding.";
    }
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>

</body>
</html>
